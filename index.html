<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<!--
  This site has moved to https://pankajjangid.com

  Why this file replaced the old portfolio:
  pankajjangid.github.io was a near-duplicate of pankajjangid.com -- same person,
  same job title, same keywords, no canonical between them. Google split the
  ranking signal across both and was surfacing THIS site above the real one for
  the query "Pankaj Kumar Jangid Android developer".

  The canonical tag plus the redirect below merge both sites' accumulated
  authority into pankajjangid.com, and keep every old inbound link working.

  GitHub Pages cannot issue a real 301, so this uses the two mechanisms a static
  host does have: rel=canonical (tells Google which URL is the original) and a
  0-second meta refresh (which Google treats as a permanent redirect when the
  canonical agrees with it). The JS redirect is a belt-and-braces fallback that
  preserves any path or query string.
-->

<title>Pankaj Kumar Jangid — Senior Android Developer</title>
<link rel="canonical" href="https://pankajjangid.com/">
<meta http-equiv="refresh" content="0; url=https://pankajjangid.com/">
<meta name="description" content="Pankaj Kumar Jangid, Senior Android Developer. This site has moved to pankajjangid.com.">
<meta name="robots" content="noindex, follow">

<style>
  :root { color-scheme: light dark; }
  body {
    margin: 0;
    min-height: 100vh;
    display: grid;
    place-items: center;
    padding: 24px;
    font: 16px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, system-ui, sans-serif;
    background: #0f1115;
    color: #e6e8ea;
    text-align: center;
  }
  main { max-width: 32rem; }
  h1 { font-size: 1.25rem; font-weight: 600; margin: 0 0 .5rem; }
  p { margin: 0 0 1.5rem; color: #9aa3ab; }
  a.go {
    display: inline-block;
    padding: .75rem 1.25rem;
    border-radius: 10px;
    background: #b8ff5c;
    color: #0f1115;
    font-weight: 600;
    text-decoration: none;
  }
  a.go:focus-visible { outline: 3px solid #fff; outline-offset: 3px; }
</style>
</head>
<body>
<main>
  <h1>Pankaj Kumar Jangid — Senior Android Developer</h1>
  <p>This site has moved to <strong>pankajjangid.com</strong>. Redirecting you now.</p>
  <a class="go" href="https://pankajjangid.com/">Continue to pankajjangid.com</a>
</main>
<script>
  // Preserve any deep path/query the visitor arrived with.
  (function () {
    var target = 'https://pankajjangid.com' + window.location.pathname + window.location.search + window.location.hash;
    window.location.replace(target);
  })();
</script>
</body>
</html>
